<!DOCTYPE html>
<html lang="zh-CN" data-theme="rose">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【杉达康复自用】人体关节训练动作库</title>
  <meta name="description" content="杉达康复内部自用：按关节与运动方向分类的人体训练动作库">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <p data-aigc-mark="1" class="aigc-mark">AI生成</p>

  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🦴</div>
        <div class="brand-text">
          <h1>人体关节训练动作库<span class="badge-self">杉达康复自用</span></h1>
          <div class="subtitle">基于 exercises-dataset 开源数据 · 按关节与运动方向分类 · 内部教学参考</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="theme-picker" role="group" aria-label="色调选择">
          <span class="label">色调</span>
          <button type="button" class="theme-swatch" data-t="rose" title="深玫红" aria-label="深玫红主题"></button>
          <button type="button" class="theme-swatch" data-t="teal" title="深青碧" aria-label="深青碧主题"></button>
          <button type="button" class="theme-swatch" data-t="indigo" title="浅靛蓝" aria-label="浅靛蓝主题"></button>
          <button type="button" class="theme-swatch" data-t="sand" title="浅暖沙" aria-label="浅暖沙主题"></button>
        </div>
      </div>
    </div>
    <div class="stats" id="headerStats"></div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-title">关节选择</div>
      <div id="jointList"></div>
    </aside>

    <main class="main" id="mainContent">
      <div class="empty-state">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>正在加载动作数据…</p>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
      <button class="close-btn" type="button" aria-label="关闭" onclick="closeModal()">✕</button>
      <div class="gif-area" id="modalGif"></div>
      <div class="detail-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
