<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人体关节训练动作库</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eaeaea;
    --text-dim: #8892a0;
    --border: #2a2a4a;
    --radius: 12px;
    --glow: 0 0 20px rgba(233,69,96,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === Header === */
  .header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 {
    font-size: 1.6rem; font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
  .header .stats {
    display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap;
  }
  .header .stat {
    font-size: 0.75rem; color: var(--text-dim);
    background: rgba(255,255,255,0.05); padding: 3px 10px; border-radius: 20px;
  }
  .header .stat strong { color: var(--accent); }

  /* === Layout === */
  .app { display: flex; min-height: calc(100vh - 100px); }

  /* === Sidebar === */
  .sidebar {
    width: 220px; min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    position: sticky; top: 80px; height: calc(100vh - 80px);
    overflow-y: auto;
  }
  .sidebar-title {
    padding: 0 16px 12px; font-size: 0.75rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .joint-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 16px; border: none; background: none;
    color: var(--text); font-size: 0.9rem; cursor: pointer;
    transition: all 0.2s;
  }
  .joint-btn:hover { background: rgba(255,255,255,0.05); }
  .joint-btn.active {
    background: rgba(233,69,96,0.15); color: var(--accent);
    border-right: 3px solid var(--accent);
  }
  .joint-btn .icon { font-size: 1.3rem; }
  .joint-btn .count {
    margin-left: auto; font-size: 0.75rem; color: var(--text-dim);
    background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 10px;
  }
  .joint-btn.active .count { background: rgba(233,69,96,0.2); color: var(--accent); }

  /* === Main Content === */
  .main { flex: 1; padding: 24px 32px; max-width: 900px; }

  /* Body diagram */
  .body-diagram {
    text-align: center; padding: 20px 0 10px;
  }
  .body-diagram svg { max-height: 320px; }
  .joint-hotspot {
    cursor: pointer; fill: transparent; stroke: none;
    transition: all 0.3s;
  }
  .joint-hotspot:hover { fill: rgba(233,69,96,0.2); }
  .joint-hotspot.active { fill: rgba(233,69,96,0.35); stroke: var(--accent); stroke-width: 2; }
  .joint-label {
    font-size: 10px; fill: var(--text-dim); text-anchor: middle;
    pointer-events: none;
  }
  .joint-hotspot.active + .joint-label,
  .joint-hotspot:hover + .joint-label { fill: var(--accent); }

  /* Movement tabs */
  .movement-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 16px 0; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .mov-tab {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: 0.8rem;
    cursor: pointer; transition: all 0.2s;
  }
  .mov-tab:hover { border-color: var(--accent); color: var(--text); }
  .mov-tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .mov-tab .badge {
    display: inline-block; margin-left: 4px;
    font-size: 0.7rem; opacity: 0.7;
  }

  /* Exercise grid */
  .exercise-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px; margin-top: 16px;
  }
  .exercise-card {
    background: var(--surface); border-radius: var(--radius);
    overflow: hidden; border: 1px solid var(--border);
    cursor: pointer; transition: all 0.3s;
  }
  .exercise-card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: var(--glow);
  }
  .exercise-card .thumb {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    background: var(--surface2);
  }
  .exercise-card .info { padding: 10px 12px; }
  .exercise-card .name {
    font-size: 0.82rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .exercise-card .meta {
    font-size: 0.72rem; color: var(--text-dim); margin-top: 4px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .exercise-card .tag {
    background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
  }

  /* Detail modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
    justify-content: center; align-items: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 16px; max-width: 640px;
    width: 100%; max-height: 90vh; overflow-y: auto;
    border: 1px solid var(--border);
  }
  .modal .gif-area {
    width: 100%; background: #000; display: flex;
    justify-content: center; align-items: center; min-height: 300px;
  }
  .modal .gif-area img {
    max-width: 100%; max-height: 400px; object-fit: contain;
  }
  .modal .detail-body { padding: 20px 24px; }
  .modal .detail-body h2 { font-size: 1.15rem; margin-bottom: 12px; }
  .modal .detail-meta {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .modal .detail-tag {
    padding: 4px 10px; border-radius: 6px; font-size: 0.78rem;
    background: rgba(233,69,96,0.12); color: var(--accent);
  }
  .modal .steps { margin-top: 12px; }
  .modal .steps h3 { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
  .modal .steps ol {
    padding-left: 20px; font-size: 0.85rem; line-height: 1.7;
  }
  .modal .steps li { margin-bottom: 4px; }
  .modal .close-btn {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    background: rgba(0,0,0,0.5); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  /* Search */
  .search-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .search-bar input {
    flex: 1; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 0.85rem; outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-dim); }

  /* Equipment filter */
  .equip-filter {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .equip-btn {
    padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: 0.72rem;
    cursor: pointer; transition: all 0.2s;
  }
  .equip-btn:hover { border-color: var(--accent); }
  .equip-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Mobile */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%; min-width: unset; height: auto; position: static;
      display: flex; flex-wrap: wrap; padding: 8px; gap: 4px;
    }
    .sidebar-title { display: none; }
    .joint-btn { padding: 6px 10px; font-size: 0.8rem; }
    .joint-btn .count { display: none; }
    .main { padding: 16px; }
    .exercise-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .body-diagram svg { max-height: 200px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🦴 人体关节训练动作库</h1>
  <div class="subtitle">基于 exercises-dataset 开源数据集，按关节和运动方向分类展示</div>
  <div class="stats" id="headerStats"></div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-title">关节选择</div>
    <div id="jointList"></div>
  </div>

  <div class="main" id="mainContent">
    <div class="empty-state">
      <div class="icon">🦴</div>
      <p>← 点击左侧关节开始探索</p>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent" style="position:relative;">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="gif-area" id="modalGif"></div>
    <div class="detail-body" id="modalBody"></div>
  </div>
</div>

<script>
// Data will be loaded
let exercises = {};
let jointMapping = {};
let currentJoint = null;
let currentMovement = 'all';
let currentSearch = '';
let currentEquipment = 'all';

// 使用 GitHub raw 链接加载图片，无需本地部署素材
const BASE_IMG = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const EQUIP_LABELS = {
  'body weight': '自重', 'dumbbell': '哑铃', 'barbell': '杠铃',
  'cable': '绳索', 'band': '弹力带', 'kettlebell': '壶铃',
  'machine': '器械', 'ez barbell': '曲杆', 'medicine ball': '药球',
  'resistance band': '阻力带', 'stability ball': '稳定球',
  'smith machine': '史密斯机', 'leverage machine': '杠杆器械',
  'olympic barbell': '奥杠', 'trap bar': '六角杠',
};

async function loadData() {
  const [exRes, mapRes] = await Promise.all([
    fetch('data/exercises_compact.json'),
    fetch('data/joint_mapping.json'),
  ]);
  exercises = await exRes.json();
  jointMapping = await mapRes.json();
  renderSidebar();
  renderStats();
}

function renderStats() {
  const meta = jointMapping._meta;
  const stats = document.getElementById('headerStats');
  let html = `<span class="stat"><strong>1324</strong> 个动作</span>`;
  for (const [jid, jd] of Object.entries(meta)) {
    const count = Object.values(jointMapping[jid] || {}).reduce((s, a) => s + a.length, 0);
    if (count > 0) {
      html += `<span class="stat">${jd.icon} <strong>${jd.name_zh}</strong> ${count}</span>`;
    }
  }
  stats.innerHTML = html;
}

function renderSidebar() {
  const meta = jointMapping._meta;
  const list = document.getElementById('jointList');
  let html = '';
  for (const [jid, jd] of Object.entries(meta)) {
    const count = Object.values(jointMapping[jid] || {}).reduce((s, a) => s + a.length, 0);
    const active = currentJoint === jid ? 'active' : '';
    html += `<button class="joint-btn ${active}" onclick="selectJoint('${jid}')">
      <span class="icon">${jd.icon}</span>
      <span>${jd.name_zh}</span>
      <span class="count">${count}</span>
    </button>`;
  }
  list.innerHTML = html;
}

function selectJoint(jid) {
  currentJoint = jid;
  currentMovement = 'all';
  currentSearch = '';
  currentEquipment = 'all';
  renderSidebar();
  renderMain();
}

function renderMain() {
  if (!currentJoint) return;
  const meta = jointMapping._meta[currentJoint];
  const movements = jointMapping[currentJoint];

  // Collect all exercise IDs for this joint
  let allIds = [];
  for (const [mid, ids] of Object.entries(movements)) {
    allIds.push(...ids);
  }
  allIds = [...new Set(allIds)];

  // Apply movement filter
  let filteredIds = currentMovement === 'all' ? allIds :
    (movements[currentMovement] || []);

  // Get exercise objects
  let filtered = filteredIds.map(id => exercises[id]).filter(Boolean);

  // Apply search
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(ex =>
      ex.name.toLowerCase().includes(q) ||
      (ex.muscle_group || '').toLowerCase().includes(q) ||
      (ex.target || '').toLowerCase().includes(q)
    );
  }

  // Apply equipment filter
  const equipCounts = {};
  filtered.forEach(ex => {
    equipCounts[ex.equipment] = (equipCounts[ex.equipment] || 0) + 1;
  });
  if (currentEquipment !== 'all') {
    filtered = filtered.filter(ex => ex.equipment === currentEquipment);
  }

  // Sort by name
  filtered.sort((a, b) => a.name.localeCompare(b.name));

  // Build HTML
  let html = '';

  // Body diagram
  html += renderBodyDiagram();

  // Movement tabs
  html += '<div class="movement-tabs">';
  html += `<button class="mov-tab ${currentMovement === 'all' ? 'active' : ''}" onclick="selectMovement('all')">全部<span class="badge">${allIds.length}</span></button>`;
  for (const [mid, md] of Object.entries(meta.movements)) {
    const count = (movements[mid] || []).length;
    if (count > 0) {
      html += `<button class="mov-tab ${currentMovement === mid ? 'active' : ''}" onclick="selectMovement('${mid}')">${md.name_zh}<span class="badge">${count}</span></button>`;
    }
  }
  html += '</div>';

  // Search
  html += `<div class="search-bar">
    <input type="text" placeholder="搜索动作名称、肌肉群..." value="${currentSearch}" oninput="onSearch(this.value)">
  </div>`;

  // Equipment filter
  const sortedEquip = Object.entries(equipCounts).sort((a, b) => b[1] - a[1]);
  if (sortedEquip.length > 1) {
    html += '<div class="equip-filter">';
    html += `<button class="equip-btn ${currentEquipment === 'all' ? 'active' : ''}" onclick="filterEquip('all')">全部器材</button>`;
    for (const [eq, cnt] of sortedEquip) {
      const label = EQUIP_LABELS[eq] || eq;
      html += `<button class="equip-btn ${currentEquipment === eq ? 'active' : ''}" onclick="filterEquip('${eq}')">${label} (${cnt})</button>`;
    }
    html += '</div>';
  }

  // Exercise grid
  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的动作</p></div>`;
  } else {
    html += `<div class="exercise-grid">`;
    for (const ex of filtered) {
      html += renderExerciseCard(ex);
    }
    html += '</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

function renderBodyDiagram() {
  // Simplified front-view body SVG with clickable joint hotspots
  const joints = [
    { id: 'neck', cx: 200, cy: 68, r: 18, label: '颈椎', labelY: 48 },
    { id: 'shoulder', cx: 145, cy: 115, r: 24, label: '肩关节', labelY: 95 },
    { id: 'elbow', cx: 118, cy: 175, r: 16, label: '肘关节', labelY: 165 },
    { id: 'wrist', cx: 105, cy: 230, r: 14, label: '腕关节', labelY: 250 },
    { id: 'spine', cx: 200, cy: 160, r: 22, label: '脊柱', labelY: 145 },
    { id: 'hip', cx: 185, cy: 215, r: 20, label: '髋关节', labelY: 205 },
    { id: 'knee', cx: 178, cy: 285, r: 18, label: '膝关节', labelY: 275 },
    { id: 'ankle', cx: 175, cy: 345, r: 14, label: '踝关节', labelY: 365 },
  ];

  let svg = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="max-height:320px;">
    <!-- Body outline -->
    <g fill="none" stroke="#3a3a5c" stroke-width="1.5" stroke-linecap="round">
      <!-- Head -->
      <ellipse cx="200" cy="40" rx="22" ry="26"/>
      <!-- Neck -->
      <line x1="200" y1="66" x2="200" y2="85"/>
      <!-- Torso -->
      <path d="M160,85 Q200,80 240,85 L235,200 Q200,210 165,200 Z"/>
      <!-- Left arm -->
      <path d="M160,90 L130,115 L118,175 L108,225"/>
      <!-- Right arm -->
      <path d="M240,90 L270,115 L282,175 L292,225"/>
      <!-- Left leg -->
      <path d="M175,200 L172,250 L178,285 L175,340 L168,365"/>
      <!-- Right leg -->
      <path d="M225,200 L228,250 L222,285 L225,340 L232,365"/>
    </g>
    <!-- Joint hotspots -->`;

  for (const j of joints) {
    const active = currentJoint === j.id ? 'active' : '';
    svg += `<circle class="joint-hotspot ${active}" cx="${j.cx}" cy="${j.cy}" r="${j.r}" onclick="selectJoint('${j.id}')"/>`;
    svg += `<text class="joint-label" x="${j.cx}" y="${j.labelY}" onclick="selectJoint('${j.id}')" style="cursor:pointer">${j.label}</text>`;
  }

  // Mirror right side joints
  const rightJoints = [
    { id: 'shoulder', cx: 255, cy: 115, r: 24 },
    { id: 'elbow', cx: 282, cy: 175, r: 16 },
    { id: 'wrist', cx: 295, cy: 230, r: 14 },
    { id: 'hip', cx: 215, cy: 215, r: 20 },
    { id: 'knee', cx: 222, cy: 285, r: 18 },
    { id: 'ankle', cx: 225, cy: 345, r: 14 },
  ];
  for (const j of rightJoints) {
    const active = currentJoint === j.id ? 'active' : '';
    svg += `<circle class="joint-hotspot ${active}" cx="${j.cx}" cy="${j.cy}" r="${j.r}" onclick="selectJoint('${j.id}')"/>`;
  }

  svg += '</svg>';
  return `<div class="body-diagram">${svg}</div>`;
}

function renderExerciseCard(ex) {
  const imgUrl = BASE_IMG + ex.image;
  const equip = EQUIP_LABELS[ex.equipment] || ex.equipment;
  return `<div class="exercise-card" onclick="openDetail('${ex.id}')">
    <img class="thumb" src="${imgUrl}" alt="${ex.name}" loading="lazy"
         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%231a1a2e%22 width=%22200%22 height=%22200%22/><text x=%22100%22 y=%22100%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2214%22>No Image</text></svg>'">
    <div class="info">
      <div class="name" title="${ex.name}">${ex.name}</div>
      <div class="meta">
        <span class="tag">${equip}</span>
        ${ex.muscle_group ? `<span class="tag">${ex.muscle_group}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function openDetail(id) {
  const ex = exercises[id];
  if (!ex) return;

  const gifUrl = BASE_IMG + ex.gif;
  const equip = EQUIP_LABELS[ex.equipment] || ex.equipment;

  document.getElementById('modalGif').innerHTML = `<img src="${gifUrl}" alt="${ex.name}">`;

  let body = `<h2>${ex.name}</h2>`;
  body += '<div class="detail-meta">';
  body += `<span class="detail-tag">${equip}</span>`;
  if (ex.muscle_group) body += `<span class="detail-tag">${ex.muscle_group}</span>`;
  if (ex.target) body += `<span class="detail-tag">目标: ${ex.target}</span>`;
  body += '</div>';

  if (ex.zh && ex.zh.length > 0) {
    body += '<div class="steps"><h3>中文说明</h3><ol>';
    ex.zh.forEach(s => body += `<li>${s}</li>`);
    body += '</ol></div>';
  }

  if (ex.en && ex.en.length > 0) {
    body += '<div class="steps"><h3>English Instructions</h3><ol>';
    ex.en.forEach(s => body += `<li>${s}</li>`);
    body += '</ol></div>';
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function selectMovement(mid) {
  currentMovement = mid;
  renderMain();
}

function onSearch(val) {
  currentSearch = val;
  renderMain();
}

function filterEquip(eq) {
  currentEquipment = eq;
  renderMain();
}

// Init
loadData();
</script>
</body>
</html>
